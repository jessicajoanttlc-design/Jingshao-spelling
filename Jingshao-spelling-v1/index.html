<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>尾熊 Spelling Adventure</title>
<style>
:root{--cream:#fff8ee;--paper:#fff;--ink:#302a27;--muted:#80766e;--orange:#ff9661;--orange2:#ffe1cf;--blue:#72a7ef;--green:#50a66e;--red:#d46161;--line:#eadfd5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(#fff5e8,#fffdf9);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh}
.app{max-width:760px;margin:auto;padding:18px 14px 40px}
.hero{text-align:center;margin:4px 0 16px}
.hero h1{font-size:30px;margin:0}.hero p{margin:5px 0;color:var(--muted)}
.card{background:var(--paper);border-radius:24px;padding:20px;box-shadow:0 9px 28px rgba(80,54,35,.09);margin-bottom:14px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pill{padding:8px 12px;border-radius:999px;background:#fff0e5;font-weight:800}
.progress{height:12px;background:#eee6df;border-radius:99px;overflow:hidden;margin:14px 0}
.bar{height:100%;background:var(--orange);width:0;transition:.25s}
.center{text-align:center}.emoji{font-size:52px;margin:10px}.title{font-size:25px;font-weight:900;margin:6px}.hint{color:var(--muted);min-height:24px}
button{border:0;border-radius:16px;padding:13px 16px;font-size:17px;font-weight:800;background:var(--orange);color:white;cursor:pointer}
button:active{transform:scale(.98)}
.secondary{background:#f4ede7;color:var(--ink)}.blue{background:var(--blue)}.green{background:var(--green)}
.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:14px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.choice{background:#fff9f4;color:var(--ink);border:2px solid var(--line);min-height:60px;font-size:20px}
.choice.correct{background:#edf8f0;border-color:var(--green)}.choice.wrong{background:#fff0f0;border-color:var(--red)}
.parts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.part{background:#edf4ff;color:#334a70;border:2px solid #d6e5ff;min-width:115px;font-size:22px}
.built{font-size:30px;font-weight:900;min-height:45px;text-align:center;margin:12px}
input{width:100%;border:2px solid var(--line);border-radius:17px;font-size:30px;text-align:center;padding:14px;outline:none}
input:focus{border-color:var(--orange)}
.feedback{font-size:19px;font-weight:850;text-align:center;min-height:30px;margin:10px}
.goodtxt{color:var(--green)}.badtxt{color:var(--red)}
.group-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.group{background:#fff7f0;color:var(--ink);border:2px solid var(--line);padding:18px 8px}
.group strong{display:block;font-size:22px}.group small{display:block;margin-top:5px;color:var(--muted)}
.review span{display:inline-block;background:#f7eee7;padding:7px 10px;border-radius:10px;margin:4px;font-weight:750}
.hidden{display:none!important}.tiny{font-size:13px;color:var(--muted)}
.starburst{font-size:64px;text-align:center}
@media(max-width:520px){.group-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.app{padding:12px 10px 30px}}
</style>
</head>
<body>
<div class="app">
<div class="hero"><h1>🐨 尾熊 Spelling Adventure</h1><p>Listen → Build → Spell!</p></div>

<div id="home" class="card">
  <div class="center">
    <div class="emoji">🎧 🧩 ✏️</div>
    <div class="title">今天要挑戰哪一組？</div>
    <p class="hint">每組只有 5 個字。完成三關就過關！</p>
  </div>
  <div class="group-grid" id="groups"></div>
  <div class="controls"><button class="secondary" onclick="startReview()">🔁 只練錯字</button></div>
  <div class="center tiny" id="savedInfo"></div>
</div>

<div id="game" class="card hidden">
  <div class="top">
    <div class="pill" id="levelPill">Level 1</div>
    <div class="pill" id="stars">⭐ 0</div>
  </div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="center">
    <div class="emoji" id="levelEmoji">🎧</div>
    <div class="title" id="levelTitle">Listen & Choose</div>
    <div class="hint" id="instruction"></div>
  </div>

  <div class="controls">
    <button onclick="playWord(1)">🔊 Play</button>
    <button class="secondary" onclick="playWord(.82)">🐢 Slow</button>
  </div>
  <audio id="player" preload="auto"></audio>

  <div id="level1" class="grid"></div>

  <div id="level2" class="hidden">
    <div class="built" id="built">_ · _</div>
    <div class="parts" id="parts"></div>
    <div class="controls">
      <button class="secondary" onclick="clearBuilt()">↩️ 重來</button>
      <button class="green" onclick="checkBuild()">✅ 檢查</button>
    </div>
  </div>

  <div id="level3" class="hidden">
    <input id="spellInput" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="type the word">
    <div class="controls">
      <button class="green" onclick="checkSpell()">✅ Check</button>
      <button class="secondary" onclick="showHint()">✂️ Hint</button>
    </div>
  </div>

  <div id="feedback" class="feedback"></div>
  <div class="controls"><button id="nextBtn" class="blue hidden" onclick="next()">Next →</button></div>
</div>

<div id="finish" class="card hidden">
  <div class="starburst">🏆</div>
  <div class="center">
    <div class="title" id="finishTitle">完成！</div>
    <p id="finishText"></p>
    <div class="review" id="finishReview"></div>
    <div class="controls">
      <button onclick="goHome()">🏠 回首頁</button>
      <button class="secondary" onclick="startReview()">🔁 練錯字</button>
    </div>
  </div>
</div>
</div>

<script>
const WORDS = [{"w": "tantrum", "parts": ["tan", "trum"]}, {"w": "pilgrim", "parts": ["pil", "grim"]}, {"w": "inflict", "parts": ["in", "flict"]}, {"w": "address", "parts": ["ad", "dress"]}, {"w": "flipflop", "parts": ["flip", "flop"]}, {"w": "untwist", "parts": ["un", "twist"]}, {"w": "hundred", "parts": ["hun", "dred"]}, {"w": "kindred", "parts": ["kin", "dred"]}, {"w": "acquit", "parts": ["ac", "quit"]}, {"w": "distress", "parts": ["dis", "tress"]}, {"w": "pumpkin", "parts": ["pump", "kin"]}, {"w": "muskrat", "parts": ["musk", "rat"]}, {"w": "anklet", "parts": ["ank", "let"]}, {"w": "abstract", "parts": ["ab", "stract"]}, {"w": "complex", "parts": ["com", "plex"]}];
const GROUPS=[WORDS.slice(0,5),WORDS.slice(5,10),WORDS.slice(10,15)];
let session=[], pos=0, level=1, stars=0, built=[], answered=false, reviewMode=false;
let wrong=new Set(JSON.parse(localStorage.getItem("jingshaoWrong")||"[]"));
let mastered=new Set(JSON.parse(localStorage.getItem("jingshaoMastered")||"[]"));
const $=id=>document.getElementById(id);
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const current=()=>session[pos];

function save(){localStorage.setItem("jingshaoWrong",JSON.stringify([...wrong]));localStorage.setItem("jingshaoMastered",JSON.stringify([...mastered]));}
function makeGroups(){
 const box=$("groups"); box.innerHTML="";
 GROUPS.forEach((g,i)=>{
   const done=g.filter(x=>mastered.has(x.w)).length;
   const b=document.createElement("button"); b.className="group";
   b.innerHTML=`<strong>第 ${i+1} 組</strong><small>${g.map(x=>x.w).join(" · ")}</small><small>🏅 ${done}/5 mastered</small>`;
   b.onclick=()=>startGroup(i); box.appendChild(b);
 });
 $("savedInfo").textContent=wrong.size?`目前有 ${wrong.size} 個字需要再練。`:"目前沒有待複習的錯字。";
}
function startGroup(i){reviewMode=false;session=shuffle(GROUPS[i]);begin();}
function startReview(){
 const arr=WORDS.filter(x=>wrong.has(x.w));
 if(!arr.length){alert("目前沒有錯字需要複習！🎉");return;}
 reviewMode=true;session=shuffle(arr);begin();
}
function begin(){pos=0;level=1;stars=0;$("home").classList.add("hidden");$("finish").classList.add("hidden");$("game").classList.remove("hidden");render();}
function playWord(rate=1){
 const p=$("player");p.pause();p.src=`audio/${current().w}.mp3`;p.playbackRate=rate;p.currentTime=0;p.play().catch(()=>{});
}
function render(){
 answered=false;built=[];$("feedback").textContent="";$("feedback").className="feedback";$("nextBtn").classList.add("hidden");
 $("stars").textContent=`⭐ ${stars}`;
 const total=session.length*3, done=(level-1)*session.length+pos;
 $("bar").style.width=`${done/total*100}%`;
 $("level1").classList.add("hidden");$("level2").classList.add("hidden");$("level3").classList.add("hidden");
 if(level===1){$("levelPill").textContent="LEVEL 1";$("levelEmoji").textContent="🎧";$("levelTitle").textContent="Listen & Choose";$("instruction").textContent=`第 ${pos+1}/${session.length} 題：聽聲音，選正確的字。`;renderChoose();}
 if(level===2){$("levelPill").textContent="LEVEL 2";$("levelEmoji").textContent="🧩";$("levelTitle").textContent="Build the Word";$("instruction").textContent=`第 ${pos+1}/${session.length} 題：聽聲音，把兩塊拼起來。`;renderBuild();}
 if(level===3){$("levelPill").textContent="LEVEL 3";$("levelEmoji").textContent="✏️";$("levelTitle").textContent="Spell It!";$("instruction").textContent=`第 ${pos+1}/${session.length} 題：只靠耳朵拼完整單字。`;renderSpell();}
 setTimeout(()=>playWord(1),250);
}
function mark(ok){
 answered=true;
 if(ok){stars++;$("feedback").textContent="答對了！⭐";$("feedback").className="feedback goodtxt";}
 else{$("feedback").className="feedback badtxt";wrong.add(current().w);}
 $("stars").textContent=`⭐ ${stars}`;save();$("nextBtn").classList.remove("hidden");
}
function renderChoose(){
 $("level1").classList.remove("hidden");
 const target=current().w;
 let pool=shuffle(WORDS.filter(x=>x.w!==target)).slice(0,3).map(x=>x.w);
 let opts=shuffle([target,...pool]), box=$("level1");box.innerHTML="";
 opts.forEach(o=>{let b=document.createElement("button");b.className="choice";b.textContent=o;b.onclick=()=>{
   if(answered)return;
   [...box.children].forEach(x=>x.disabled=true);
   if(o===target){b.classList.add("correct");wrong.delete(target);mark(true);}
   else{b.classList.add("wrong");[...box.children].find(x=>x.textContent===target).classList.add("correct");$("feedback").textContent=`正確是 ${target}`;mark(false);}
 };box.appendChild(b);});
}
function renderBuild(){
 $("level2").classList.remove("hidden");$("built").textContent="_ · _";
 let distract=[];
 WORDS.filter(x=>x.w!==current().w).forEach(x=>distract.push(...x.parts));
 let opts=shuffle([...current().parts,...shuffle(distract).slice(0,2)]);
 let box=$("parts");box.innerHTML="";
 opts.forEach(p=>{let b=document.createElement("button");b.className="part";b.textContent=p;b.onclick=()=>{if(built.length<2){built.push(p);$("built").textContent=built.join(" · ");}};box.appendChild(b);});
}
function clearBuilt(){built=[];$("built").textContent="_ · _";}
function checkBuild(){
 if(answered||built.length<2)return;
 let ok=built[0]===current().parts[0]&&built[1]===current().parts[1];
 if(ok){wrong.delete(current().w);mark(true);}
 else{$("feedback").textContent=`提示：${current().parts.join(" · ")}`;mark(false);}
}
function renderSpell(){
 $("level3").classList.remove("hidden");$("spellInput").value="";setTimeout(()=>$("spellInput").focus(),350);
}
function showHint(){$("instruction").textContent=`提示：${current().parts.join(" · ")}`;wrong.add(current().w);save();}
function checkSpell(){
 if(answered)return;let v=$("spellInput").value.trim().toLowerCase();if(!v)return;
 if(v===current().w){wrong.delete(current().w);mastered.add(current().w);mark(true);}
 else{$("feedback").textContent=`正確是 ${current().w}`;mark(false);}
}
function next(){
 pos++;
 if(pos>=session.length){pos=0;level++;if(level>3){finish();return;}}
 render();
}
function finish(){
 $("game").classList.add("hidden");$("finish").classList.remove("hidden");
 $("finishTitle").textContent=reviewMode?"複習完成！":"這一組完成！";
 $("finishText").textContent=`你得到 ${stars} / ${session.length*3} 顆星 ⭐`;
 let still=session.filter(x=>wrong.has(x.w));
 $("finishReview").innerHTML=still.length?`<p>再練一下：</p>${still.map(x=>`<span>${x.w}</span>`).join("")}`:"<p>🎉 這組沒有待複習的字！</p>";
 save();
}
function goHome(){$("finish").classList.add("hidden");$("game").classList.add("hidden");$("home").classList.remove("hidden");makeGroups();}
$("spellInput").addEventListener("keydown",e=>{if(e.key==="Enter")checkSpell();});
makeGroups();
</script>
</body>
</html>
